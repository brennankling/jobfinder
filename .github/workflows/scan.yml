name: Scan job boards

on:
  schedule:
    - cron: "17 11 * * *"     # daily, ~7:17 AM Eastern (11:17 UTC)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write              # to commit docs/data/jobs.json

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Scan
        run: python -m jobhunt run

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Scan $(date -u +%F)"
            git push
          fi
