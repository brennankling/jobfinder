# RTL internship hunter — configuration
#
# Every source is fetched on each run. A source that fails (wrong slug, moved
# platform, rate limit) is logged and shown in the dashboard's "Sources" panel;
# it never breaks the rest of the run.
#
# Platforms:
#   greenhouse  slug  = the name in boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>
#   lever       slug  = the name in jobs.lever.co/<slug>
#   ashby       slug  = the name in jobs.ashbyhq.com/<slug>
#   auto        slugs = guesses; tries Greenhouse, then Ashby, then Lever, uses the first that answers
#   workday     url   = the careers site URL, e.g. https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   jibe        url   = careers site root for Jibe-hosted sites (e.g. careers.amd.com)
#   amazon      (no extra fields) amazon.jobs search, covers Annapurna Labs and Amazon devices hardware
#
# To find a Workday URL: open any job on the company's careers site; if the address
# contains "myworkdayjobs.com", copy everything up to and including the site name.
# Run `python -m jobhunt probe <slug>` to test a Greenhouse/Ashby/Lever guess.

[filter]
# Score needed to show up on the dashboard. See jobhunt/filters.py for weights.
min_score = 6
# Only internships/co-ops. Set false to also see new-grad and full-time roles.
interns_only = true
# Drop jobs whose location only mentions these places (multi-location jobs that
# also list a US site are kept).
exclude_locations = [
  "India", "Bangalore", "Bengaluru", "Hyderabad", "Pune", "Noida", "Chennai",
  "Israel", "Haifa", "Yokneam", "Tel Aviv",
  "Taiwan", "Hsinchu", "Taipei", "China", "Shanghai", "Beijing", "Shenzhen",
  "Germany", "Munich", "United Kingdom", "UK", "Cambridge, UK", "Ireland", "Cork",
  "Japan", "Tokyo", "Korea", "Seoul", "Singapore", "Malaysia", "Penang",
  "Vietnam", "Poland", "Romania", "Serbia", "Mexico", "Costa Rica",
  "Netherlands", "France", "Sweden", "Finland", "Spain", "Italy", "Belgium",
]
# Workday sites are searched with these terms (Workday returns at most 20 per page).
workday_search_terms = ["intern", "co-op"]
# amazon.jobs search queries
amazon_queries = ["hardware engineer intern", "ASIC intern", "design verification intern", "FPGA intern"]
# amazon.jobs country codes to search (USA, CAN, GBR, ...)
amazon_countries = ["USA", "CAN"]

